name: Build DeepRemover EXE

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build portable EXE
        run: >
          pyinstaller --onefile --noconsole --uac-admin
          --name DeepRemover DeepRemover.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepRemover-portable
          path: dist/DeepRemover.exe

      - name: Attach to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DeepRemover.exe
